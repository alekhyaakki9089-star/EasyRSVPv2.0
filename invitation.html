<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation - EasyRSVP</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .invitation-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .invitation-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        
        .invitation-preview {
            background: linear-gradient(135deg, #d4af37, #f4e4bc);
            color: white;
            padding: 4rem 2rem;
            position: relative;
        }
        
        .invitation-preview::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="80" r="2" fill="rgba(255,255,255,0.1)"/></svg>');
            opacity: 0.3;
        }
        
        .invitation-content {
            position: relative;
            z-index: 2;
        }
        
        .event-title {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
        }
        
        .event-subtitle {
            font-size: 1.3rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .event-details {
            margin-bottom: 2rem;
        }
        
        .event-detail {
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
            font-weight: 500;
        }
        
        .event-description {
            font-size: 1.1rem;
            line-height: 1.6;
            opacity: 0.9;
            margin-bottom: 2rem;
        }
        
        .rsvp-button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 16px 32px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .rsvp-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            color: white;
        }
        
        .invitation-footer {
            padding: 2rem;
            background: #f8fafc;
            color: #6b7280;
        }
        
        .powered-by {
            font-size: 0.9rem;
        }
        
        .powered-by a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        
        @media (max-width: 768px) {
            .invitation-preview {
                padding: 3rem 1.5rem;
            }
            
            .event-title {
                font-size: 2.2rem;
            }
            
            .event-subtitle {
                font-size: 1.1rem;
            }
            
            .event-detail {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="invitation-container">
        <div class="invitation-card">
            <div class="invitation-preview" id="invitationPreview">
                <div class="invitation-content">
                    <div class="event-title" id="eventTitle">Sarah & John's Wedding</div>
                    <div class="event-subtitle" id="eventSubtitle">Request the pleasure of your company</div>
                    <div class="event-details">
                        <div class="event-detail" id="eventDate">Saturday, June 15, 2026</div>
                        <div class="event-detail" id="eventTime">3:00 PM</div>
                        <div class="event-detail" id="eventVenue">Garden Manor</div>
                    </div>
                    <div class="event-description" id="eventDescription">
                        Join us for a beautiful celebration of love in our garden venue.
                    </div>
                    <a href="#" class="rsvp-button" id="rsvpButton">RSVP Now</a>
                </div>
            </div>
            
            <div class="invitation-footer">
                <div class="powered-by">
                    Created with <a href="index.html">EasyRSVP</a> • Create your own beautiful invitations
                </div>
            </div>
        </div>
    </div>

    <script>
        class InvitationView {
            constructor() {
                this.invitationId = this.getInvitationIdFromUrl();
                this.init();
            }
            
            getInvitationIdFromUrl() {
                const urlParams = new URLSearchParams(window.location.search);
                const idFromParam = urlParams.get('id');
                
                if (idFromParam) {
                    return idFromParam;
                }
                
                const pathParts = window.location.pathname.split('/');
                const invitationIndex = pathParts.indexOf('invitation');
                if (invitationIndex !== -1 && pathParts[invitationIndex + 1]) {
                    return pathParts[invitationIndex + 1];
                }
                
                return 'demo_invitation';
            }
            
            init() {
                this.loadInvitationData();
            }
            
            loadInvitationData() {
                const storedData = localStorage.getItem(`invitation_${this.invitationId}`);
                
                let invitationData;
                if (storedData) {
                    invitationData = JSON.parse(storedData);
                } else {
                    // Demo data
                    invitationData = {
                        id: this.invitationId,
                        title: 'Sarah & John\'s Wedding',
                        subtitle: 'Request the pleasure of your company',
                        date: '2026-06-15',
                        time: '15:00',
                        venue: 'Garden Manor',
                        description: 'Join us for a beautiful celebration of love in our garden venue.',
                        primaryColor: '#d4af37'
                    };
                }
                
                this.renderInvitation(invitationData);
            }
            
            renderInvitation(data) {
                document.getElementById('eventTitle').textContent = data.title;
                document.getElementById('eventSubtitle').textContent = data.subtitle;
                
                const eventDate = new Date(data.date + 'T' + data.time);
                document.getElementById('eventDate').textContent = eventDate.toLocaleDateString('en-US', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                
                document.getElementById('eventTime').textContent = eventDate.toLocaleTimeString('en-US', {
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: true
                });
                
                document.getElementById('eventVenue').textContent = data.venue;
                document.getElementById('eventDescription').textContent = data.description;
                
                // Apply theme colors
                if (data.primaryColor) {
                    const preview = document.getElementById('invitationPreview');
                    const color = data.primaryColor;
                    const rgb = this.hexToRgb(color);
                    const lightColor = `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.8)`;
                    preview.style.background = `linear-gradient(135deg, ${color}, ${lightColor})`;
                }
                
                // Set RSVP link
                document.getElementById('rsvpButton').href = `rsvp.html?id=${this.invitationId}`;
            }
            
            hexToRgb(hex) {
                const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
                return result ? {
                    r: parseInt(result[1], 16),
                    g: parseInt(result[2], 16),
                    b: parseInt(result[3], 16)
                } : { r: 212, g: 175, b: 55 };
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            new InvitationView();
        });
    </script>
</body>
</html>
