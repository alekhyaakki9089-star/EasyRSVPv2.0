<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - EasyRSVP</title>
    <link rel="stylesheet" href="auth-styles.css?v=3">
    <!-- Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>👋 Welcome Back</h1>
                <p>Sign in to your EasyRSVP account</p>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            
            <!-- Social Login Options -->
            <div class="social-login">
                <button class="social-btn google" id="googleSignin">
                    <span>G</span> Continue with Google
                </button>
                <button class="social-btn facebook" id="facebookSignin">
                    <span>f</span> Continue with Facebook
                </button>
            </div>
            
            <div class="divider">
                <span>or sign in with email</span>
            </div>
            
            <form id="signinForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="Email Address" required autocomplete="username">
                    <div class="validation-message" id="emailError"></div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Password" required autocomplete="current-password">
                    <div class="validation-message" id="passwordError"></div>
                </div>
                
                <div class="forgot-password">
                    <a href="#" class="auth-link">Forgot your password?</a>
                </div>
                
                <button type="submit" class="btn-primary">Sign In to My Account</button>
            </form>
            
            <!-- Demo Account Info -->
            <div class="demo-account">
                <h4>Demo Account:</h4>
                <p>Email: <strong>demo@easyrsvp.com</strong></p>
                <p>Password: <strong>demo123</strong></p>
            </div>
            
            <div class="auth-footer">
                <p>Don't have an account? <a href="signup.html" class="auth-link">Sign Up</a></p>
                <a href="index.html" class="back-link">← Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        // Validation functions
        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
        
        function showValidationMessage(elementId, message, type = 'error') {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = `validation-message ${type}`;
        }
        
        function hideValidationMessage(elementId) {
            const element = document.getElementById(elementId);
            element.style.display = 'none';
        }
        
        function setFieldState(fieldId, isValid) {
            const field = document.getElementById(fieldId);
            field.classList.remove('valid', 'invalid');
            if (isValid !== null) {
                field.classList.add(isValid ? 'valid' : 'invalid');
            }
        }
        
        // Check for URL parameters and show appropriate messages
        document.addEventListener('DOMContentLoaded', function() {
            // Check for test signin data from automated test
            const testSigninData = sessionStorage.getItem('testSigninData');
            if (testSigninData) {
                try {
                    const data = JSON.parse(testSigninData);
                    console.log('📋 Auto-filling signin data from automated test');
                    
                    document.getElementById('email').value = data.email || '';
                    document.getElementById('password').value = data.password || '';
                    
                    // Clear the test data
                    sessionStorage.removeItem('testSigninData');
                    
                    // Show notification
                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'result info';
                    infoDiv.innerHTML = `
                        <strong>🧪 Test Mode</strong><br>
                        Signin form auto-filled with test credentials.
                    `;
                    infoDiv.style.cssText = `
                        background: #d1ecf1; color: #0c5460; padding: 15px; 
                        border-radius: 8px; margin-bottom: 20px; text-align: center;
                    `;
                    document.querySelector('.auth-card').insertBefore(infoDiv, document.querySelector('.error-message'));
                    
                } catch (error) {
                    console.error('Error loading test signin data:', error);
                }
            }
            
            const urlParams = new URLSearchParams(window.location.search);
            const message = urlParams.get('message');
            const redirect = urlParams.get('redirect');
            
            if (message === 'verify') {
                const infoDiv = document.createElement('div');
                infoDiv.className = 'result info';
                infoDiv.innerHTML = `
                    <strong>📧 Email Verification Required</strong><br>
                    Please check your email and click the verification link before signing in.
                `;
                infoDiv.style.cssText = `
                    background: #d1ecf1; color: #0c5460; padding: 15px; 
                    border-radius: 8px; margin-bottom: 20px; text-align: center;
                `;
                document.querySelector('.auth-card').insertBefore(infoDiv, document.querySelector('.error-message'));
            }
            
            // Store redirect URL for after successful signin
            if (redirect) {
                sessionStorage.setItem('redirectAfterSignin', redirect);
            }
            
            // Real-time validation
            const email = document.getElementById('email');
            const password = document.getElementById('password');
            
            // Email validation
            email.addEventListener('blur', function() {
                if (this.value) {
                    const isValid = validateEmail(this.value);
                    setFieldState('email', isValid);
                    if (!isValid) {
                        showValidationMessage('emailError', 'Please enter a valid email address');
                    } else {
                        hideValidationMessage('emailError');
                    }
                } else {
                    setFieldState('email', null);
                    hideValidationMessage('emailError');
                }
            });
            
            // Password validation
            password.addEventListener('blur', function() {
                if (this.value) {
                    const isValid = this.value.length >= 3; // Minimum length for signin
                    setFieldState('password', isValid);
                    if (!isValid) {
                        showValidationMessage('passwordError', 'Password is too short');
                    } else {
                        hideValidationMessage('passwordError');
                    }
                } else {
                    setFieldState('password', null);
                    hideValidationMessage('passwordError');
                }
            });
            
            // Clear validation on input
            email.addEventListener('input', function() {
                if (this.classList.contains('invalid')) {
                    setFieldState('email', null);
                    hideValidationMessage('emailError');
                }
            });
            
            password.addEventListener('input', function() {
                if (this.classList.contains('invalid')) {
                    setFieldState('password', null);
                    hideValidationMessage('passwordError');
                }
            });
        });
        
        document.getElementById('signinForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const signinBtn = document.querySelector('button[type="submit"]'); // Fix: Get the submit button
            
            // Hide previous messages
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            
            // Validation
            let isValid = true;
            let errors = [];
            
            // Email validation
            if (!email) {
                errors.push('Email address is required');
                setFieldState('email', false);
                isValid = false;
            } else if (!validateEmail(email)) {
                errors.push('Please enter a valid email address');
                setFieldState('email', false);
                isValid = false;
            }
            
            // Password validation
            if (!password) {
                errors.push('Password is required');
                setFieldState('password', false);
                isValid = false;
            } else if (password.length < 3) {
                errors.push('Password is too short');
                setFieldState('password', false);
                isValid = false;
            }
            
            if (!isValid) {
                errorMessage.innerHTML = errors.join('<br>');
                errorMessage.style.display = 'block';
                return;
            }
            
            // Disable button during signin
            signinBtn.disabled = true;
            signinBtn.innerHTML = 'Signing In...';
            
            try {
                // Wait for Supabase to be ready
                let attempts = 0;
                while (!window.easyrsvpDB && attempts < 20) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }

                if (!window.easyrsvpDB) {
                    throw new Error('Database not available. Please refresh the page.');
                }

                console.log('🔐 Signing in with Supabase...');
                
                // Sign in with Supabase Auth
                const { data: authData, error: authError } = await window.easyrsvpDB.signIn(email, password);

                if (authError) {
                    throw new Error(authError.message);
                }

                console.log('✅ Sign in successful:', authData);

                // Set field states to success
                setFieldState('email', true);
                setFieldState('password', true);
                
                // Show success message
                successMessage.textContent = 'Welcome back! Redirecting to dashboard...';
                successMessage.style.display = 'block';
                
                // Store user session info
                sessionStorage.setItem('userAuthenticated', 'true');
                localStorage.setItem('easyrsvp_user', JSON.stringify({
                    id: authData.user.id,
                    email: authData.user.email,
                    full_name: authData.user.user_metadata?.full_name || authData.user.email
                }));
                
                // Check for redirect URL
                const redirectUrl = sessionStorage.getItem('redirectAfterSignin');
                sessionStorage.removeItem('redirectAfterSignin');
                
                // Redirect to appropriate page
                setTimeout(() => {
                    if (redirectUrl) {
                        window.location.href = redirectUrl;
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }, 1500);

            } catch (error) {
                console.error('❌ Signin error:', error);
                
                let errorMsg = error.message;
                
                // Handle common Supabase errors
                if (errorMsg.includes('Invalid login credentials')) {
                    errorMsg = `Invalid email or password.<br>
                               Try the demo account: <strong>demo@easyrsvp.com</strong> / <strong>demo123</strong><br>
                               Or <a href="signup.html" style="color: #667eea;">create a new account</a>.`;
                } else if (errorMsg.includes('Email not confirmed')) {
                    errorMsg = `Your email address needs to be verified.<br>
                               Please check your email for a verification link.<br>
                               <a href="signup.html" style="color: #667eea;">Didn't receive the email? Sign up again</a>.`;
                } else if (errorMsg.includes('Too many requests')) {
                    errorMsg = 'Too many sign-in attempts. Please wait a moment and try again.';
                }
                
                setFieldState('email', false);
                setFieldState('password', false);
                
                errorMessage.innerHTML = errorMsg;
                errorMessage.style.display = 'block';
                
                signinBtn.disabled = false;
                signinBtn.textContent = 'Sign In to My Account';
            }
        });
        
        // Social login handlers
        document.getElementById('googleSignin').addEventListener('click', () => {
            alert('Google sign-in would integrate with Google OAuth in production');
        });
        
        document.getElementById('facebookSignin').addEventListener('click', () => {
            alert('Facebook sign-in would integrate with Facebook Login in production');
        });
        
        // Check if already logged in
        if (sessionStorage.getItem('userAuthenticated') === 'true') {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
