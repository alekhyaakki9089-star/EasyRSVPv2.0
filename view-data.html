<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Supabase Data - EasyRSVP</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .header { background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .controls { margin: 20px 0; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
        button:hover { background: #0056b3; }
        .data-container { background: #f8f9fa; padding: 20px; border-radius: 8px; margin: 10px 0; }
        .data-item { background: white; padding: 15px; margin: 10px 0; border-radius: 4px; border-left: 4px solid #007bff; }
        .data-item h3 { margin: 0 0 10px 0; color: #333; }
        .data-item p { margin: 5px 0; color: #666; }
        .data-item .meta { font-size: 0.9em; color: #999; }
        .error { background: #f8d7da; color: #721c24; padding: 15px; border-radius: 4px; margin: 10px 0; }
        .success { background: #d4edda; color: #155724; padding: 15px; border-radius: 4px; margin: 10px 0; }
        .loading { text-align: center; padding: 20px; color: #666; }
        pre { background: #f1f3f4; padding: 10px; border-radius: 4px; overflow-x: auto; font-size: 0.9em; }
        .stats { display: flex; gap: 20px; margin: 20px 0; }
        .stat-card { background: white; padding: 15px; border-radius: 8px; text-align: center; flex: 1; }
        .stat-number { font-size: 2em; font-weight: bold; color: #007bff; }
        .stat-label { color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 EasyRSVP Data Viewer</h1>
        <p>View and monitor data saved to your Supabase database</p>
    </div>

    <div class="controls">
        <button onclick="loadInvitations()">🔄 Refresh Invitations</button>
        <button onclick="loadRSVPs()">📋 Load RSVPs</button>
        <button onclick="testConnection()">🧪 Test Connection</button>
        <button onclick="clearData()">🗑️ Clear Display</button>
    </div>

    <div class="stats" id="stats" style="display: none;">
        <div class="stat-card">
            <div class="stat-number" id="invitationCount">0</div>
            <div class="stat-label">Invitations</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="rsvpCount">0</div>
            <div class="stat-label">RSVPs</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="lastUpdated">-</div>
            <div class="stat-label">Last Updated</div>
        </div>
    </div>

    <div id="results"></div>

    <!-- Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>

    <script>
        function showMessage(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = message;
            results.appendChild(div);
        }

        function showLoading(message = 'Loading...') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = 'loading';
            div.innerHTML = `⏳ ${message}`;
            results.appendChild(div);
            return div;
        }

        function clearData() {
            document.getElementById('results').innerHTML = '';
            document.getElementById('stats').style.display = 'none';
        }

        async function testConnection() {
            clearData();
            const loading = showLoading('Testing connection...');

            try {
                // Wait for database to be ready
                let attempts = 0;
                while (!window.easyrsvpDB && attempts < 20) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }

                if (!window.easyrsvpDB) {
                    loading.remove();
                    showMessage('❌ Database not available. Please refresh the page.', 'error');
                    return;
                }

                const result = await window.easyrsvpDB.testConnection();
                loading.remove();

                if (result.success) {
                    showMessage('✅ Connection successful! Database is working properly.', 'success');
                } else {
                    showMessage(`❌ Connection failed: ${result.error.message}`, 'error');
                }
            } catch (error) {
                loading.remove();
                showMessage(`❌ Connection test error: ${error.message}`, 'error');
            }
        }

        async function loadInvitations() {
            clearData();
            const loading = showLoading('Loading invitations...');

            try {
                // Wait for database to be ready
                let attempts = 0;
                while (!window.easyrsvpDB && attempts < 20) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }

                if (!window.easyrsvpDB) {
                    loading.remove();
                    showMessage('❌ Database not available. Please refresh the page.', 'error');
                    return;
                }

                const { data, error } = await window.easyrsvpDB.getUserInvitations();
                loading.remove();

                if (error) {
                    showMessage(`❌ Error loading invitations: ${error.message}`, 'error');
                    return;
                }

                // Update stats
                document.getElementById('invitationCount').textContent = data.length;
                document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();
                document.getElementById('stats').style.display = 'flex';

                if (data.length === 0) {
                    showMessage('📭 No invitations found. Try creating one in the template editor!', 'success');
                    return;
                }

                showMessage(`✅ Found ${data.length} invitation(s)`, 'success');

                // Display invitations
                const container = document.createElement('div');
                container.className = 'data-container';
                container.innerHTML = '<h2>📨 Invitations</h2>';

                data.forEach(invitation => {
                    const item = document.createElement('div');
                    item.className = 'data-item';
                    item.innerHTML = `
                        <h3>${invitation.title || 'Untitled Invitation'}</h3>
                        <p><strong>Date:</strong> ${invitation.date || 'Not set'}</p>
                        <p><strong>Time:</strong> ${invitation.time || 'Not set'}</p>
                        <p><strong>Venue:</strong> ${invitation.venue || 'Not set'}</p>
                        <p><strong>Description:</strong> ${invitation.description || 'No description'}</p>
                        <div class="meta">
                            <p><strong>ID:</strong> ${invitation.id}</p>
                            <p><strong>Created:</strong> ${new Date(invitation.created_at).toLocaleString()}</p>
                            <p><strong>Language:</strong> ${invitation.language || 'english'}</p>
                            <p><strong>Theme:</strong> ${invitation.theme || 'elegant'}</p>
                        </div>
                        <details>
                            <summary>View Raw Data</summary>
                            <pre>${JSON.stringify(invitation, null, 2)}</pre>
                        </details>
                    `;
                    container.appendChild(item);
                });

                document.getElementById('results').appendChild(container);

            } catch (error) {
                loading.remove();
                showMessage(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function loadRSVPs() {
            clearData();
            const loading = showLoading('Loading RSVPs...');

            try {
                if (!window.easyrsvpDB) {
                    loading.remove();
                    showMessage('❌ Database not available. Please refresh the page.', 'error');
                    return;
                }

                // First get invitations to get their IDs
                const { data: invitations, error: invError } = await window.easyrsvpDB.getUserInvitations();
                
                if (invError) {
                    loading.remove();
                    showMessage(`❌ Error loading invitations: ${invError.message}`, 'error');
                    return;
                }

                if (invitations.length === 0) {
                    loading.remove();
                    showMessage('📭 No invitations found. Create an invitation first!', 'success');
                    return;
                }

                let allRSVPs = [];
                
                // Get RSVPs for each invitation
                for (const invitation of invitations) {
                    const { data: rsvps, error: rsvpError } = await window.easyrsvpDB.getRSVPs(invitation.id);
                    if (!rsvpError && rsvps) {
                        allRSVPs = allRSVPs.concat(rsvps.map(rsvp => ({
                            ...rsvp,
                            invitation_title: invitation.title
                        })));
                    }
                }

                loading.remove();

                // Update stats
                document.getElementById('rsvpCount').textContent = allRSVPs.length;
                document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();
                document.getElementById('stats').style.display = 'flex';

                if (allRSVPs.length === 0) {
                    showMessage('📭 No RSVPs found yet.', 'success');
                    return;
                }

                showMessage(`✅ Found ${allRSVPs.length} RSVP(s)`, 'success');

                // Display RSVPs
                const container = document.createElement('div');
                container.className = 'data-container';
                container.innerHTML = '<h2>📋 RSVPs</h2>';

                allRSVPs.forEach(rsvp => {
                    const item = document.createElement('div');
                    item.className = 'data-item';
                    item.innerHTML = `
                        <h3>${rsvp.guest_name}</h3>
                        <p><strong>Invitation:</strong> ${rsvp.invitation_title}</p>
                        <p><strong>Attendance:</strong> ${rsvp.attendance}</p>
                        <p><strong>Email:</strong> ${rsvp.guest_email || 'Not provided'}</p>
                        <p><strong>Plus Ones:</strong> ${rsvp.plus_ones || 0}</p>
                        <p><strong>Message:</strong> ${rsvp.message || 'No message'}</p>
                        <div class="meta">
                            <p><strong>RSVP Date:</strong> ${new Date(rsvp.created_at).toLocaleString()}</p>
                        </div>
                    `;
                    container.appendChild(item);
                });

                document.getElementById('results').appendChild(container);

            } catch (error) {
                loading.remove();
                showMessage(`❌ Error: ${error.message}`, 'error');
            }
        }

        // Auto-load invitations when page loads
        window.addEventListener('load', () => {
            setTimeout(loadInvitations, 1000);
        });
    </script>
</body>
</html>
