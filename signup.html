<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - EasyRSVP</title>
    <link rel="stylesheet" href="auth-styles.css?v=4">
    <!-- Supabase -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Brand Logo -->
            <div class="brand-logo">
                <div class="logo-icon">E</div>
                <div class="logo-text">EasyRSVP</div>
            </div>
            
            <div class="auth-header">
                <h1>Join EasyRSVP</h1>
                <p>Create beautiful invitations in minutes</p>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            
            <!-- Social Login Options -->
            <div class="social-login">
                <button class="social-btn google" id="googleSignup">
                    <div class="icon">G</div>
                    <span>Continue with Google</span>
                </button>
                <button class="social-btn facebook" id="facebookSignup">
                    <div class="icon">f</div>
                    <span>Continue with Facebook</span>
                </button>
            </div>
            
            <div class="divider">
                <span>or create account with email</span>
            </div>
            
            <form id="signupForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="Enter your email address" required autocomplete="username">
                    <div class="validation-message" id="emailError"></div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Create a strong password" required minlength="8" autocomplete="new-password">
                    <button type="button" class="password-toggle" id="passwordToggle">👁️</button>
                    <div class="validation-message" id="passwordError"></div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm your password" required autocomplete="new-password">
                    <div class="validation-message" id="confirmPasswordError"></div>
                </div>
                
                <div class="form-group">
                    <label for="language">Preferred Language</label>
                    <select id="language" class="form-input" required>
                        <option value="">Select your language</option>
                        <option value="english">English</option>
                        <option value="telugu">తెలుగు (Telugu)</option>
                        <option value="hindi">हिंदी (Hindi)</option>
                        <option value="gujarati">ગુજરાતી (Gujarati)</option>
                        <option value="tamil">தமிழ் (Tamil)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms" required>
                        I agree to the <a href="#terms" class="auth-link">Terms of Service</a> 
                        and <a href="#privacy" class="auth-link">Privacy Policy</a>
                    </label>
                </div>
                
                <button type="submit" class="btn-primary" id="signupBtn">
                    <span>Create My Account</span>
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Already have an account? <a href="signin.html" class="auth-link">Sign In</a></p>
                <a href="index.html" class="back-link">← Back to Home</a>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <h3>Creating your account...</h3>
        </div>
    </div>

    <script>
        // Simple form validation and submission
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('signupForm');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            
            // Password toggle
            document.getElementById('passwordToggle').addEventListener('click', function() {
                const passwordInput = document.getElementById('password');
                const type = passwordInput.type === 'password' ? 'text' : 'password';
                passwordInput.type = type;
                this.textContent = type === 'password' ? '👁️' : '🙈';
            });
            
            // Form submission
            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const formData = {
                    email: document.getElementById('email').value.trim(),
                    password: document.getElementById('password').value,
                    confirmPassword: document.getElementById('confirmPassword').value,
                    language: document.getElementById('language').value,
                    terms: document.getElementById('terms').checked
                };
                
                // Basic validation
                if (!formData.email || !formData.password || !formData.confirmPassword || !formData.language) {
                    showMessage('Please fill in all required fields.', 'error');
                    return;
                }
                
                if (formData.password !== formData.confirmPassword) {
                    showMessage('Passwords do not match.', 'error');
                    return;
                }
                
                if (formData.password.length < 8) {
                    showMessage('Password must be at least 8 characters long.', 'error');
                    return;
                }
                
                if (!formData.terms) {
                    showMessage('Please accept the Terms of Service.', 'error');
                    return;
                }
                
                // Show loading
                loadingOverlay.classList.add('show');
                
                try {
                    // Wait for Supabase to be ready
                    let attempts = 0;
                    while (!window.easyrsvpDB && attempts < 20) {
                        await new Promise(resolve => setTimeout(resolve, 100));
                        attempts++;
                    }

                    if (!window.easyrsvpDB) {
                        throw new Error('Database not available. Please refresh the page.');
                    }

                    // Create user with Supabase Auth
                    const { data: authData, error: authError } = await window.easyrsvpDB.signUp(
                        formData.email, 
                        formData.password, 
                        {
                            full_name: 'User',
                            language: formData.language
                        }
                    );

                    if (authError) {
                        throw new Error(authError.message);
                    }

                    // Success
                    showMessage(`
                        <div style="text-align: center;">
                            <h3 style="color: var(--success-color); margin: 0 0 10px 0;">🎉 Account Created!</h3>
                            <p>Welcome to EasyRSVP! Redirecting to dashboard...</p>
                        </div>
                    `, 'success');
                    
                    // Store user session
                    sessionStorage.setItem('userAuthenticated', 'true');
                    localStorage.setItem('easyrsvp_user', JSON.stringify({
                        id: authData.user.id,
                        email: authData.user.email,
                        full_name: 'User'
                    }));
                    
                    // Redirect after delay
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 2000);

                } catch (error) {
                    console.error('Signup error:', error);
                    let errorMsg = error.message;
                    
                    if (errorMsg.includes('already registered')) {
                        errorMsg = `Account already exists. <a href="signin.html" style="color: var(--primary-color);">Sign in instead</a>`;
                    }
                    
                    showMessage(errorMsg, 'error');
                } finally {
                    loadingOverlay.classList.remove('show');
                }
            });
            
            // Social login handlers
            document.getElementById('googleSignup').addEventListener('click', () => {
                showMessage('Google signup coming soon!', 'info');
            });
            
            document.getElementById('facebookSignup').addEventListener('click', () => {
                showMessage('Facebook signup coming soon!', 'info');
            });
            
            function showMessage(message, type = 'error') {
                const messageEl = type === 'error' ? errorMessage : successMessage;
                const otherEl = type === 'error' ? successMessage : errorMessage;
                
                otherEl.classList.remove('show');
                messageEl.innerHTML = message;
                messageEl.classList.add('show');
                
                if (type === 'success') {
                    setTimeout(() => messageEl.classList.remove('show'), 5000);
                }
            }
            
            // Check if already logged in
            if (sessionStorage.getItem('userAuthenticated') === 'true') {
                window.location.href = 'dashboard.html';
            }
        });
    </script>

    <!-- Supabase Integration -->
    <script src="auth-supabase.js"></script>
</body>
</html>
