<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - EasyRSVP</title>
    <link rel="stylesheet" href="auth-styles.css?v=3">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>🎉 Join EasyRSVP</h1>
                <p>Create beautiful invitations in minutes</p>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            
            <!-- Social Login Options -->
            <div class="social-login">
                <button class="social-btn google" id="googleSignup">
                    <span>G</span> Continue with Google
                </button>
                <button class="social-btn facebook" id="facebookSignup">
                    <span>f</span> Continue with Facebook
                </button>
            </div>
            
            <div class="divider">
                <span>or sign up with email</span>
            </div>
            
            <form id="signupForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="Email Address" required>
                    <div class="validation-message" id="emailError"></div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Password" required minlength="8">
                    <div class="password-requirements">
                        <small>Password must contain:</small>
                        <ul class="requirements-list">
                            <li id="req-length">At least 8 characters</li>
                            <li id="req-uppercase">One uppercase letter</li>
                            <li id="req-lowercase">One lowercase letter</li>
                            <li id="req-number">One number</li>
                            <li id="req-special">One special character</li>
                        </ul>
                    </div>
                    <div class="validation-message" id="passwordError"></div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm Password" required>
                    <div class="validation-message" id="confirmPasswordError"></div>
                </div>
                
                <div class="form-group">
                    <label for="language">Preferred Language</label>
                    <select id="language" class="form-input" required>
                        <option value="">Select Language</option>
                        <option value="english">English</option>
                        <option value="telugu">తెలుగు (Telugu)</option>
                        <option value="hindi">हिंदी (Hindi)</option>
                        <option value="gujarati">ગુજરાતી (Gujarati)</option>
                        <option value="tamil">தமிழ் (Tamil)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="eventType">Primary Event Type</label>
                    <select id="eventType" class="form-input">
                        <option value="">Select Type</option>
                        <option value="wedding">Weddings</option>
                        <option value="party">Parties</option>
                        <option value="corporate">Corporate Events</option>
                        <option value="baby">Baby Showers</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="terms" required>
                        I agree to the <a href="#" class="auth-link">Terms of Service</a> 
                        and <a href="#" class="auth-link">Privacy Policy</a>
                    </label>
                </div>
                
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="newsletter">
                        Send me updates about new templates and features
                    </label>
                </div>
                
                <button type="submit" class="btn-primary" id="signupBtn">
                    Create My Account
                </button>
            </form>
            
            <div class="auth-footer">
                <p>Already have an account? <a href="signin.html" class="auth-link">Sign In</a></p>
                <a href="index.html" class="back-link">← Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        // Validation functions
        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
        
        function validatePassword(password) {
            const requirements = {
                length: password.length >= 8,
                uppercase: /[A-Z]/.test(password),
                lowercase: /[a-z]/.test(password),
                number: /\d/.test(password),
                special: /[!@#$%^&*(),.?":{}|<>]/.test(password)
            };
            return requirements;
        }
        
        function showValidationMessage(elementId, message, type = 'error') {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = `validation-message ${type}`;
        }
        
        function hideValidationMessage(elementId) {
            const element = document.getElementById(elementId);
            element.style.display = 'none';
        }
        
        function setFieldState(fieldId, isValid) {
            const field = document.getElementById(fieldId);
            field.classList.remove('valid', 'invalid');
            field.classList.add(isValid ? 'valid' : 'invalid');
        }
        
        // Real-time validation
        document.addEventListener('DOMContentLoaded', function() {
            // Check for test data from automated test
            const testData = sessionStorage.getItem('testAccountData');
            if (testData) {
                try {
                    const data = JSON.parse(testData);
                    console.log('📋 Auto-filling test data from automated test');
                    
                    document.getElementById('email').value = data.email || '';
                    document.getElementById('password').value = data.password || '';
                    document.getElementById('confirmPassword').value = data.confirmPassword || '';
                    document.getElementById('language').value = data.language || 'english';
                    document.getElementById('eventType').value = data.eventType || 'wedding';
                    document.getElementById('terms').checked = data.terms || false;
                    document.getElementById('newsletter').checked = data.newsletter || false;
                    
                    // Clear the test data
                    sessionStorage.removeItem('testAccountData');
                    
                    // Show notification
                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'result info';
                    infoDiv.innerHTML = `
                        <strong>🧪 Test Mode</strong><br>
                        Form auto-filled with test data. You can modify or submit as-is.
                    `;
                    infoDiv.style.cssText = `
                        background: #d1ecf1; color: #0c5460; padding: 15px; 
                        border-radius: 8px; margin-bottom: 20px; text-align: center;
                    `;
                    document.querySelector('.auth-card').insertBefore(infoDiv, document.querySelector('.error-message'));
                    
                } catch (error) {
                    console.error('Error loading test data:', error);
                }
            }
            
            const email = document.getElementById('email');
            const password = document.getElementById('password');
            const confirmPassword = document.getElementById('confirmPassword');
            const language = document.getElementById('language');
            
            // Email validation
            email.addEventListener('input', function() {
                const isValid = validateEmail(this.value);
                if (this.value) {
                    setFieldState('email', isValid);
                    if (!isValid) {
                        showValidationMessage('emailError', 'Please enter a valid email address');
                    } else {
                        showValidationMessage('emailError', 'Email format is valid', 'success');
                    }
                } else {
                    hideValidationMessage('emailError');
                    this.classList.remove('valid', 'invalid');
                }
            });
            
            // Password validation with real-time requirements
            password.addEventListener('input', function() {
                const requirements = validatePassword(this.value);
                const allValid = Object.values(requirements).every(req => req);
                
                setFieldState('password', allValid);
                
                // Update requirements list
                document.getElementById('req-length').classList.toggle('valid', requirements.length);
                document.getElementById('req-uppercase').classList.toggle('valid', requirements.uppercase);
                document.getElementById('req-lowercase').classList.toggle('valid', requirements.lowercase);
                document.getElementById('req-number').classList.toggle('valid', requirements.number);
                document.getElementById('req-special').classList.toggle('valid', requirements.special);
                
                if (this.value && allValid) {
                    showValidationMessage('passwordError', 'Password meets all requirements', 'success');
                } else if (this.value) {
                    showValidationMessage('passwordError', 'Password does not meet all requirements');
                } else {
                    hideValidationMessage('passwordError');
                }
                
                // Revalidate confirm password if it has a value
                if (confirmPassword.value) {
                    validateConfirmPassword();
                }
            });
            
            // Confirm password validation
            function validateConfirmPassword() {
                const isValid = confirmPassword.value === password.value && password.value !== '';
                setFieldState('confirmPassword', isValid);
                
                if (confirmPassword.value) {
                    if (isValid) {
                        showValidationMessage('confirmPasswordError', 'Passwords match', 'success');
                    } else {
                        showValidationMessage('confirmPasswordError', 'Passwords do not match');
                    }
                } else {
                    hideValidationMessage('confirmPasswordError');
                }
            }
            
            confirmPassword.addEventListener('input', validateConfirmPassword);
            
            // Language validation
            language.addEventListener('change', function() {
                const isValid = this.value !== '';
                setFieldState('language', isValid);
            });
        });
        
        // Enhanced form submission with validation
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                confirmPassword: document.getElementById('confirmPassword').value,
                language: document.getElementById('language').value,
                eventType: document.getElementById('eventType').value,
                terms: document.getElementById('terms').checked,
                newsletter: document.getElementById('newsletter').checked
            };
            
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            const signupBtn = document.getElementById('signupBtn');
            
            // Hide previous messages
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            
            // Comprehensive validation
            let isValid = true;
            let errors = [];
            
            // Email validation
            if (!validateEmail(formData.email)) {
                errors.push('Please enter a valid email address');
                setFieldState('email', false);
                isValid = false;
            }
            
            // Password validation
            const passwordRequirements = validatePassword(formData.password);
            if (!Object.values(passwordRequirements).every(req => req)) {
                errors.push('Password must meet all requirements');
                setFieldState('password', false);
                isValid = false;
            }
            
            // Confirm password validation
            if (formData.password !== formData.confirmPassword) {
                errors.push('Passwords do not match');
                setFieldState('confirmPassword', false);
                isValid = false;
            }
            
            // Language validation
            if (!formData.language) {
                errors.push('Please select your preferred language');
                setFieldState('language', false);
                isValid = false;
            }
            
            // Terms validation
            if (!formData.terms) {
                errors.push('Please accept the Terms of Service');
                isValid = false;
            }
            
            // Check if email already exists (demo check)
            const existingUser = localStorage.getItem('easyrsvp_user');
            if (existingUser) {
                const userData = JSON.parse(existingUser);
                if (userData.email === formData.email) {
                    errors.push('An account with this email already exists. Please sign in instead.');
                    setFieldState('email', false);
                    isValid = false;
                }
            }
            
            if (!isValid) {
                errorMessage.innerHTML = errors.join('<br>');
                errorMessage.style.display = 'block';
                return;
            }
            
            // Disable button during signup
            signupBtn.disabled = true;
            signupBtn.textContent = 'Creating Account...';
            
            try {
                // Wait for Supabase to be ready
                let attempts = 0;
                while (!window.easyrsvpDB && attempts < 20) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                    attempts++;
                }

                if (!window.easyrsvpDB) {
                    throw new Error('Database not available. Please refresh the page.');
                }

                console.log('🔐 Creating Supabase user account...');
                
                // Create user with Supabase Auth
                const { data: authData, error: authError } = await window.easyrsvpDB.signUp(
                    formData.email, 
                    formData.password, 
                    {
                        full_name: 'User', // Simplified since we removed name fields
                        language: formData.language,
                        event_type: formData.eventType,
                        newsletter: formData.newsletter
                    }
                );

                if (authError) {
                    throw new Error(authError.message);
                }

                console.log('✅ User account created:', authData);

                // Check if email verification is required
                const needsVerification = authData.user && !authData.user.email_confirmed_at && authData.user.confirmation_sent_at;
                
                if (needsVerification) {
                    // Show email verification message
                    successMessage.innerHTML = `
                        <div style="text-align: center;">
                            <h3 style="color: #38a169; margin: 0 0 10px 0;">🎉 Account Created Successfully!</h3>
                            <p><strong>Important:</strong> Please check your email <strong>${formData.email}</strong></p>
                            <p>Click the verification link in the email to activate your account.</p>
                            <p style="margin-top: 15px; padding: 10px; background: rgba(102, 126, 234, 0.1); border-radius: 4px;">
                                <strong>Next Steps:</strong><br>
                                1. Check your email inbox (and spam folder)<br>
                                2. Click the verification link<br>
                                3. Return here to sign in
                            </p>
                            <p style="margin-top: 10px;">Redirecting to sign in page in <span id="countdown">5</span> seconds...</p>
                        </div>
                    `;
                    successMessage.style.display = 'block';
                    
                    // Countdown timer
                    let countdown = 5;
                    const countdownElement = document.getElementById('countdown');
                    const timer = setInterval(() => {
                        countdown--;
                        if (countdownElement) {
                            countdownElement.textContent = countdown;
                        }
                        if (countdown <= 0) {
                            clearInterval(timer);
                            window.location.href = 'signin.html?message=verify';
                        }
                    }, 1000);
                } else {
                    // No email verification needed - direct signin
                    successMessage.innerHTML = `
                        <div style="text-align: center;">
                            <h3 style="color: #38a169; margin: 0 0 10px 0;">🎉 Account Created Successfully!</h3>
                            <p>Your account is ready to use!</p>
                            <p style="margin-top: 15px; padding: 10px; background: rgba(40, 167, 69, 0.1); border-radius: 4px;">
                                <strong>Welcome to EasyRSVP!</strong><br>
                                You can now start creating beautiful invitations.
                            </p>
                            <p style="margin-top: 10px;">Redirecting to dashboard in <span id="countdown">3</span> seconds...</p>
                        </div>
                    `;
                    successMessage.style.display = 'block';
                    
                    // Store user session for immediate access
                    sessionStorage.setItem('userAuthenticated', 'true');
                    localStorage.setItem('easyrsvp_user', JSON.stringify({
                        id: authData.user.id,
                        email: authData.user.email,
                        full_name: authData.user.user_metadata?.full_name || 'User'
                    }));
                    
                    // Countdown timer for dashboard redirect
                    let countdown = 3;
                    const countdownElement = document.getElementById('countdown');
                    const timer = setInterval(() => {
                        countdown--;
                        if (countdownElement) {
                            countdownElement.textContent = countdown;
                        }
                        if (countdown <= 0) {
                            clearInterval(timer);
                            window.location.href = 'dashboard.html';
                        }
                    }, 1000);
                }

            } catch (error) {
                console.error('❌ Signup error:', error);
                
                let errorMsg = error.message;
                
                // Handle common Supabase errors
                if (errorMsg.includes('already registered')) {
                    errorMsg = 'An account with this email already exists. <a href="signin.html" style="color: #667eea;">Sign in instead</a>';
                } else if (errorMsg.includes('Password should be at least')) {
                    errorMsg = 'Password must be at least 6 characters long.';
                } else if (errorMsg.includes('Invalid email')) {
                    errorMsg = 'Please enter a valid email address.';
                }
                
                errorMessage.innerHTML = errorMsg;
                errorMessage.style.display = 'block';
                
                signupBtn.disabled = false;
                signupBtn.textContent = 'Create My Account';
            }
        });
        
        // Social login handlers
        document.getElementById('googleSignup').addEventListener('click', () => {
            alert('Google signup would integrate with Google OAuth in production');
        });
        
        document.getElementById('facebookSignup').addEventListener('click', () => {
            alert('Facebook signup would integrate with Facebook Login in production');
        });
        
        // Check if already logged in
        if (sessionStorage.getItem('userAuthenticated') === 'true') {
            window.location.href = 'dashboard.html';
        }
    </script>

    <!-- Supabase Integration -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth-supabase.js"></script>
</body>
</html>
